name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # The API test suite boots the full AppModule, which now includes the
    # BullMQ email queue + rate limiter (docs/adr/0008) — they need Redis on localhost.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # apps/api's integration tests (Testcontainers) need Docker, which
      # GitHub-hosted ubuntu runners provide out of the box.
      - run: pnpm test

      - run: pnpm build
