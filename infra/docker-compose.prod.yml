# Real secrets come from infra/.env (gitignored) — see the required vars
# listed in infra/README.md. `worker` runs the same image as `api` with a
# different entrypoint (docs/adr/0006-document-expiry-job.md) — it's the only
# service that talks to `redis`; `api` never does.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      IDARA_APP_PASSWORD: ${IDARA_APP_PASSWORD}
    volumes:
      - idara_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - idara_redis_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: https://${DOMAIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DATABASE_URL: postgresql://idara_app:${IDARA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    volumes:
      # Uploaded files (employee documents, payslips, exports) — ADR-0005.
      # Included in backups together with the database.
      - idara_files:/var/lib/idara/files
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Required by the shared Zod env schema even though nothing in the
      # worker process actually uses CORS — one schema, both processes.
      CORS_ORIGIN: https://${DOMAIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DATABASE_URL: postgresql://idara_app:${IDARA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    build:
      context: ..
      dockerfile: infra/Dockerfile.caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - idara_caddy_data:/data
      - idara_caddy_config:/config
    depends_on:
      - api

volumes:
  idara_postgres_data:
  idara_redis_data:
  idara_files:
  idara_caddy_data:
  idara_caddy_config:
